<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-labelledby="title desc"><title id="title">Pipeline SÓSIA em quatro estágios</title><desc id="desc">Geração de variantes, calibração de plataforma, evidência contextual e triagem com revisão humana.</desc>
<rect width="1280" height="300" rx="24" fill="#0c1828"/><g font-family="Inter,Segoe UI,Arial,sans-serif">
<text x="42" y="42" font-size="23" font-weight="700" fill="#f2f8ff">Do nome parecido à evidência verificável</text>
<text x="42" y="70" font-size="14" fill="#8da6bb">Cada etapa pode produzir incerteza. O fluxo registra isso, em vez de esconder.</text>
<g>
<rect x="38" y="105" width="275" height="144" rx="16" fill="#16263b" stroke="#345168"/><circle cx="68" cy="135" r="16" fill="#245a54"/><text x="62" y="141" font-size="17" font-weight="700" fill="#99f2db">1</text><text x="91" y="142" font-size="19" font-weight="700" fill="#e9f4fd">GERAR</text><text x="58" y="177" font-size="15" fill="#c6d9e7">Typos · homóglifos</text><text x="58" y="202" font-size="15" fill="#c6d9e7">afixos · separadores</text><text x="58" y="228" font-size="12" fill="#93b4c4">Candidatos por plataforma</text>
<rect x="344" y="105" width="275" height="144" rx="16" fill="#16263b" stroke="#345168"/><circle cx="374" cy="135" r="16" fill="#245a54"/><text x="368" y="141" font-size="17" font-weight="700" fill="#99f2db">2</text><text x="397" y="142" font-size="19" font-weight="700" fill="#e9f4fd">CALIBRAR</text><text x="364" y="177" font-size="15" fill="#c6d9e7">Controles negativos</text><text x="364" y="202" font-size="15" fill="#c6d9e7">e perfis conhecidos</text><text x="364" y="228" font-size="12" fill="#93b4c4">Soft-404 · CAPTCHA · drift</text>
<rect x="650" y="105" width="275" height="144" rx="16" fill="#16263b" stroke="#345168"/><circle cx="680" cy="135" r="16" fill="#245a54"/><text x="674" y="141" font-size="17" font-weight="700" fill="#99f2db">3</text><text x="703" y="142" font-size="19" font-weight="700" fill="#e9f4fd">CONTEXTUALIZAR</text><text x="670" y="177" font-size="15" fill="#c6d9e7">Bio · alegação de vínculo</text><text x="670" y="202" font-size="15" fill="#c6d9e7">negações · mitigadores</text><text x="670" y="228" font-size="12" fill="#93b4c4">Sinais independentes</text>
<rect x="956" y="105" width="285" height="144" rx="16" fill="#16263b" stroke="#345168"/><circle cx="986" cy="135" r="16" fill="#245a54"/><text x="980" y="141" font-size="17" font-weight="700" fill="#99f2db">4</text><text x="1009" y="142" font-size="19" font-weight="700" fill="#e9f4fd">PRIORIZAR</text><text x="976" y="177" font-size="15" fill="#c6d9e7">Confiança · vínculo · abuso</text><text x="976" y="202" font-size="15" fill="#c6d9e7">e pacote de evidências</text><text x="976" y="228" font-size="12" fill="#93b4c4">SHA-256 · STIX · revisão</text>
</g>
<g fill="none" stroke="#73e5c7" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M319 173h18l-7-7m7 7-7 7"/><path d="M625 173h18l-7-7m7 7-7 7"/><path d="M931 173h18l-7-7m7 7-7 7"/></g>
<text x="640" y="282" text-anchor="middle" fill="#83a8b7" font-size="12">Fluxo conceitual do motor já implementado · nenhuma automação de denúncia</text>
</g></svg>