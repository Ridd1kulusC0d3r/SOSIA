[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sosia"
version = "1.2.0"
description = "SÓSIA — detecção explicável de perfis que se passam por marcas/pessoas (OSINT passivo, calibração de conectores, triagem por evidências)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = []   # núcleo: stdlib pura

[project.optional-dependencies]
web = ["gradio>=4.0"]        # frontend `sosia.webapp`
pdf = ["reportlab>=4.0"]     # relatório PDF (HTML não precisa de nada)
all = ["gradio>=4.0", "reportlab>=4.0"]

[project.scripts]
sosia = "sosia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
sosia = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
